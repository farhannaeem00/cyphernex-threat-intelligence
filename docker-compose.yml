services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cyphernex_threat_intel
      POSTGRES_USER: cyphernex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyphernex -d cyphernex_threat_intel"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://cyphernex:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/cyphernex_threat_intel
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPLOAD_DIR: /app/storage/uploads
      MLFLOW_TRACKING_URI: file:/app/mlruns
    volumes:
      - uploads:/app/storage/uploads
      - mlruns:/app/mlruns
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
volumes:
  postgres_data:
  uploads:
  mlruns:
